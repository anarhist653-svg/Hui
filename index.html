<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title></title>

    <style>
        * {
            margin: 0;
            padding: 0;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: black;
        }

        img {
            position: fixed;
            width: 100%;
            height: 100%;
            inset: 0;
            object-fit: cover;
        }
    </style>
</head>
<body>

    <img src="Oboi.WEBP" alt="">

    <audio
        id="music"
        src="Golda-standoff-2.mp3"
        autoplay
        loop
        playsinline>
    </audio>

    <script>
        const music = document.getElementById("music");

        music.volume = 1;

        music.play().catch(() => {
            // Браузер может заблокировать автоматическое воспроизведение.
        });
    </script>

</body>
</html>
