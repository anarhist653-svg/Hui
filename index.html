
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
        }

        /* Сайт под изображением */
        #site {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            border: none;
            z-index: 1;
        }

        /* Изображение поверх сайта */
        #overlay {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            background: #000;
        }

        #overlay img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
    </style>
</head>

<body>

    <div id="overlay">
        <img src="Oboi.WEBP" alt="">

        <audio
            id="music"
            src="Golda-standoff-2.mp3"
            allow:="autoplay"
            loop
            preload="auto">
        </audio>
    </div>

    <script>
        const music = document.getElementById("music");

        music.volume = 1;

        function playMusic() {
            music.play().catch(() => {});
        }

        window.addEventListener("load", playMusic);
        document.addEventListener("click", playMusic);
        document.addEventListener("touchstart", playMusic);
    </script>

</body>
</html>
